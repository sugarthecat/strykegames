<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Random Person</title>
    <script src="script.js"></script>
    <script src="data.js"></script>
    <script src="generate.js"></script>
    <script src="badges.js"></script>
</head>

<body>
    <header>
        <h1>Random Person</h1>
        <p>By T.J. Nickerson</p>
    </header>
    <p id="reroll">

    </p>

    <div id="person"></div>
    <div id="badges"></div>

        <button onclick="copyStats()">Copy</button>

    </div>
    <footer>
        <h3>Data sources</h3>
        <p>Cities data is from <a href="https://simplemaps.com/data/world-cities">simplemaps</a></p>
        <p>Names data is from <a href="https://surnam.es">Surnam.es</a></p>
    </footer>
</body>
