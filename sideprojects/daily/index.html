<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>Random Person</title>
    <script src="script.js"></script>
    <script src="data.js"></script>
    <script src="generate.js"></script>
    <script src="badges.js"></script>
    <script src="badgePacks/genders.js"></script>
    <script src="badgePacks/religions.js"></script>
    <script src="badgePacks/names.js"></script>
</head>

<body>
    <header>
        <h1>Random Person</h1>
        <p>By T.J. Nickerson</p>
    </header>
    <div class="main-content">
        <p id="reroll" hidden>
            <button onclick="dailyRoll()">Roll</button>
        </p>

        <div id="person"></div>
        <div id="badges"></div>
        <div id="copy" hidden>
            <button onclick="copyStats()">Copy</button>
            <p id="copystatus"></p>
        </div>
        <div id="waiter" hidden>
            <p>Play again in:</p>
            <h3 id="waittime"></h3>
        </div>
    </div>
    <footer>
        <h3>Data sources</h3>
        <p>Cities data is from <a href="https://simplemaps.com/data/world-cities">simplemaps</a></p>
        <p>Names data is from <a href="https://surnam.es">Surnam.es</a> and <a
                href="https://sigpwned.com/category/open-data/datasets/">Sigpwned</a></p>
    </footer>
</body>
